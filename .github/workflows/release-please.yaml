name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false
  queue: single

jobs:
  release-please:
    name: Release Please
    if: github.repository == 'gabor-boros/yaap'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create release PR or GitHub Release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
